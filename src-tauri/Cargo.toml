[package]
name = "deploygo"
version = "0.1.0"
description = "DeployGo"
authors = ["DeployGo"]
edition = "2021"

[lib]
name = "deploygo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
thiserror = "2"
